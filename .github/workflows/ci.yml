name: BOBBuy CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_playwright_e2e:
        description: "Run the Playwright UI regression gate."
        required: false
        default: false
        type: boolean
      run_postgres_migration_verify:
        description: "Run the PostgreSQL Flyway migration verification gate."
        required: false
        default: false
        type: boolean
      run_maven_dependency_audit:
        description: "Run OWASP Dependency-Check for Maven dependencies."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production release guards
        run: |
          python -B -m unittest discover -s scripts -p test_publish_production.py
          python -B -m unittest discover -s scripts -p test_postgres18_backup.py
          python -B -m unittest discover -s scripts -p test_prepare_ci_release_artifacts.py
          python -B -m unittest discover -s scripts -p test_verify_checkout_upgrade.py
          python -B -m unittest discover -s scripts -p test_verify_issue_date_upgrade.py
          node --test scripts/test_capture_article_inputs.mjs
          node --test scripts/test_capture_issue_date_inputs.mjs
          python -B scripts/check-production-isolation.py

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: python scripts/verify-backend-coverage.py

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  docker-build:
    name: docker-build
    needs:
      - backend-test
      - frontend-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend package for Docker image
        run: mvn -B -DskipTests package --file backend/pom.xml

      - name: Build actual production service packages
        run: mvn -B -DskipTests package -pl bobbuy-core,bobbuy-ai,bobbuy-im,bobbuy-auth,bobbuy-gateway -am

      - name: Build backend image
        run: docker build backend -t bobbuy-backend-test

      - name: Build source-labelled production core image
        run: >-
          docker build . --file Dockerfile.service --build-arg MODULE=bobbuy-core
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.opencontainers.image.version="ci-$GITHUB_SHA"
          --tag "bobuy/core:ci-$GITHUB_SHA"

      - name: Build frontend image
        run: >-
          docker build frontend -t bobbuy-frontend-test
          --tag "bobuy/frontend:ci-$GITHUB_SHA"
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.opencontainers.image.version="ci-$GITHUB_SHA"

      - name: Bind core and web release artifacts
        run: >-
          python scripts/prepare-ci-release-artifacts.py
          --accepted-inputs docs/reports/item-ui-integration-20261109/accepted-inputs.json
          --output "$RUNNER_TEMP/bobuy-release-artifact"

      - name: Retain exact core and web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-web-${{ github.sha }}
          path: ${{ runner.temp }}/bobuy-release-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  postgres-migration-verify:
    name: postgres-migration-verify
    if: github.event_name == 'workflow_dispatch' && inputs.run_postgres_migration_verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:1a0c23d53c1ad77468c8653fa6eed4f4105cfbef9e6f027bc1dfeb16949a8c29
        env:
          POSTGRES_DB: bobbuy
          POSTGRES_USER: bobbuy
          POSTGRES_PASSWORD: bobbuypassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bobbuy -d bobbuy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify populated V27 to V28 preservation on the isolated PostgreSQL service
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: python -B scripts/verify-checkout-upgrade.py

      - name: Verify populated V28 to V28.1 source-date preservation on the same isolated PostgreSQL service
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: python -B scripts/verify-issue-date-upgrade.py

      - name: Verify prior issue-date entity mapping on V28.1 before the application applies V31
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=RecommendationIssueDateMigrationIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=false test

      - name: Run C1/C2, article and issue-date regressions on the isolated PostgreSQL service
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=SelfProfileServiceTest,StorefrontIntegrationTest,CheckoutFingerprintTest,OrderDeliverySnapshotTest,ProductIdentityCompatibilityIntegrationTest#actualStoredOrderJsonRemainsStrictOldReaderCompatibleAndSidecarSurvivesOldShapeUpdate,RecommendationArticleRevisionIntegrationTest,RecommendationIssueDateIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true test

      - name: Verify populated V28.1 to V31 preservation before publication runtime tests
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=RecommendationPublicationMigrationIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=false test

      - name: Run publication authentication, concurrency and rollback on the same isolated V31 PostgreSQL
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=RecommendationItemPublicationIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true test

      - name: Run PENDING-aware application recovery read isolation on the same isolated V31 PostgreSQL
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=RecommendationPublicationRecoveryIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=false test

      - name: Run retained atomic article revision regressions on the same isolated V31 PostgreSQL
        env:
          BOBBUY_ISOLATED_CI_POSTGRES: 'true'
        run: >-
          mvn -B --file backend/pom.xml
          -Dtest=RecommendationArticleRevisionIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bobbuy
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.datasource.username=bobbuy
          -Dspring.datasource.password=bobbuypassword
          -Dspring.jpa.hibernate.ddl-auto=validate
          -Dspring.flyway.enabled=true test

      - name: Retain C2, item-publication and atomic article PostgreSQL migration and transaction reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-publication-postgres-${{ github.sha }}
          path: |
            backend/target/surefire-reports/
            backend/target/c2-upgrade-preservation.json
            backend/target/item-publication-upgrade-preservation.json
            backend/target/issue-date-upgrade-preservation.json
          if-no-files-found: error
          retention-days: 14

  playwright-e2e:
    name: playwright-e2e
    if: github.event_name == 'workflow_dispatch' && inputs.run_playwright_e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium dependencies
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run e2e --prefix frontend

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  maven-dependency-audit:
    name: maven-dependency-audit
    if: github.event_name == 'workflow_dispatch' && inputs.run_maven_dependency_audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bobuy-dependency-data-v12.2.2
          key: dependency-check-v12.2.2-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-v12.2.2-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-
            dependency-check-v12.2.2-${{ runner.os }}-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BOBUY_AUDIT_DATA_DIR: ${{ runner.temp }}/bobuy-dependency-data-v12.2.2
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "NVD_API_KEY GitHub Actions secret is required for this manual job." >&2
            exit 1
          fi
          bash scripts/run-dependency-audit.sh

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-dependency-check-report
          path: |
            backend/target/dependency-audit/
          if-no-files-found: ignore

  # `npm run e2e:ai` remains outside hosted default CI because it requires a dedicated
  # backend profile, external AI model access and seeded data. Images use the PostgreSQL image table.
