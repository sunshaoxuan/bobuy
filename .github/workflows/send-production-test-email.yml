name: Send production test email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    if: github.repository == 'sunshaoxuan/bobuy' && !github.event.repository.fork && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate SSH configuration
        run: |
          set -euo pipefail
          for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_PORT PROD_SSH_KEY PROD_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "Required production SSH secret is missing: $name" >&2; exit 1; }
          done
      - name: Configure verified SSH host key
        run: |
          set -euo pipefail
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/bobuy-ssh.XXXXXX")
          printf 'PROD_SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          chmod 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          install -m 600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
      - name: Send one loopback-only test message
        run: |
          set -euo pipefail
          result=$(ssh -i "$PROD_SSH_DIR/id_ed25519" -p "$PROD_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROD_SSH_DIR/known_hosts" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            'docker exec -i bobuy-auth-service sh' 2>/dev/null <<'PROBE'
          set +x
          set -eu
          test -n "${BOBBUY_SECURITY_SERVICE_TOKEN:-}" || exit 1
          if test -z "${BOBBUY_ACCOUNT_MAIL_SMTP_PASSWORD:-}"; then
            printf '%s\n' configuration_missing
            exit 0
          fi
          case "${SERVER_PORT:-}" in ''|*[!0-9]*) exit 1 ;; esac
          test "$SERVER_PORT" -ge 1 && test "$SERVER_PORT" -le 65535 || exit 1
          curl --silent --show-error --max-time 15 --request POST \
            --header "X-BOBBUY-SERVICE-TOKEN: ${BOBBUY_SECURITY_SERVICE_TOKEN}" \
            --write-out ' HTTP_STATUS=%{http_code}' \
            "http://127.0.0.1:${SERVER_PORT}/internal/account-mail/test"
          PROBE
          ) || { echo 'Production SMTP test failed: connection_or_timeout' >&2; exit 1; }
          if test "$result" = configuration_missing; then
            echo 'Production SMTP test failed: configuration_missing' >&2
            exit 1
          fi
          category=$(printf '%s' "$result" | sed -n 's/.*"category":"\([a-z_]*\)".*/\1/p')
          status=$(printf '%s' "$result" | sed -n 's/.*HTTP_STATUS=\([0-9]*\)$/\1/p')
          if test "$status" = 200; then echo 'Production SMTP test succeeded.'; exit 0; fi
          case "$category" in connection|tls|authentication|rejected|timeout|unknown) ;; *) category=unknown ;; esac
          echo "Production SMTP test failed: $category" >&2
          exit 1
      - name: Clean up production SSH files
        if: always()
        run: |
          if [[ -n "${PROD_SSH_DIR:-}" ]]; then
            rm -rf -- "$PROD_SSH_DIR"
          fi
