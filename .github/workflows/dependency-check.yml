name: Maven dependency-check

on:
  push:
    branches:
      - main
      - 'copilot/**'
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/dependency-check.yml'
      - 'scripts/run-dependency-audit.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/dependency-check.yml'
      - 'scripts/run-dependency-audit.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    name: dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      NVD_DATAFEED_URL: ${{ vars.NVD_DATAFEED_URL }}
      KNOWN_EXPLOITED_URL: ${{ vars.KNOWN_EXPLOITED_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bobuy-dependency-data-v12.2.2
          key: dependency-check-v12.2.2-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-v12.2.2-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}-
            dependency-check-v12.2.2-${{ runner.os }}-

      - name: Run OWASP dependency-check
        env:
          BOBUY_AUDIT_RUNTIME_ONLY: 'true'
          BOBUY_AUDIT_DATA_DIR: ${{ runner.temp }}/bobuy-dependency-data-v12.2.2
        shell: bash
        run: bash scripts/run-dependency-audit.sh

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            backend/target/dependency-audit/
          if-no-files-found: error
