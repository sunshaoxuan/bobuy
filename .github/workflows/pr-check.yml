name: PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect backend and frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - '**/pom.xml'
              - '.mvn/**'
              - 'mvnw*'
              - 'backend/**'
              - 'bobbuy-ai/**'
              - 'bobbuy-auth/**'
              - 'bobbuy-common/**'
              - 'bobbuy-core/**'
              - 'bobbuy-gateway/**'
              - 'bobbuy-im/**'
            frontend:
              - 'frontend/**'

  backend:
    name: Backend compile and unit tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and run unit tests
        run: mvn -B test

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test

      - name: Build
        run: npm run build
