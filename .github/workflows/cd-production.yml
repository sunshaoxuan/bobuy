name: CD production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'infra/nginx/**'
      - 'infra/nacos/config/**'
      - '**/docker-compose*.yml'
      - '**/docker-compose*.yaml'
      - '**/compose*.yml'
      - '**/compose*.yaml'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'sunshaoxuan/bobuy' && !github.event.repository.fork && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package Java services
        run: mvn -B -DskipTests package
      - uses: docker/setup-buildx-action@v3
      # Expose ACTIONS_RUNTIME_TOKEN / cache URL so shell-invoked buildx can use the gha cache backend.
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish service images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          registry="${REGISTRY,,}"
          for spec in core:bobbuy-core ai:bobbuy-ai im:bobbuy-im auth:bobbuy-auth router:bobbuy-gateway; do
            image="${spec%%:*}"; module="${spec#*:}"
            docker buildx build . --file Dockerfile.service --build-arg "MODULE=$module" \
              --tag "$registry/$image:$REVISION" --tag "$registry/$image:latest" \
              --cache-from "type=gha,scope=$image" --cache-to "type=gha,mode=max,scope=$image" --push
          done
          docker buildx build frontend --file frontend/Dockerfile \
            --tag "$registry/frontend:$REVISION" --tag "$registry/frontend:latest" \
            --cache-from type=gha,scope=frontend --cache-to type=gha,mode=max,scope=frontend --push

  deploy:
    needs: build
    if: github.repository == 'sunshaoxuan/bobuy' && !github.event.repository.fork && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      REVISION: ${{ github.sha }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Validate SSH configuration
        run: |
          set -euo pipefail
          for name in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_PORT PROD_SSH_KEY PROD_SSH_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "Required production SSH secret is missing: $name" >&2; exit 1; }
          done
      - name: Configure verified SSH host key
        run: |
          set -euo pipefail
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/bobuy-ssh.XXXXXX")
          printf 'PROD_SSH_DIR=%s\n' "$ssh_dir" >> "$GITHUB_ENV"
          chmod 700 "$ssh_dir"
          install -m 600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          install -m 600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
      - name: Deploy, verify, and roll back on failure
        id: deploy
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          registry="${REGISTRY,,}"
          ssh_opts=(-i "$PROD_SSH_DIR/id_ed25519" -p "$PROD_SSH_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PROD_SSH_DIR/known_hosts")
          remote_script=$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/bobuy
          test -f /etc/bobuy.env || { echo '/etc/bobuy.env is missing; refusing deployment.' >&2; exit 1; }
          umask 077
          mkdir -p .cd
          # Pulling six new images needs headroom; refuse before touching anything when the disk is nearly full.
          min_free_kb=$((6 * 1024 * 1024))
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          free_kb=$(df --output=avail -k "$docker_root" | tail -n 1 | tr -d ' ')
          if (( free_kb < min_free_kb )); then
            echo "Only $((free_kb / 1024)) MiB free under $docker_root; need at least 6 GiB. Refusing deployment (nothing changed)." >&2
            exit 1
          fi
          services=(core-service ai-service im-service auth-service gateway-service frontend)
          images=(core ai im auth router frontend)
          compose_files=(-f docker-compose.yml -f compose.production.yml)
          if test -f compose.rustfs.yml; then compose_files+=(-f compose.rustfs.yml); fi
          compose_files+=(-f .cd/compose.yml)
          compose() { docker compose --env-file /etc/bobuy.env -p bobuy "${compose_files[@]}" "$@"; }

          # Pin actual running image IDs before changing any application, even on first CD.
          rollback_timestamp=$(date -u +%Y%m%dT%H%M%S%NZ)
          printf 'services:\n' > .cd/rollback.yml.tmp
          for service in "${services[@]}"; do
            image_id=$(docker inspect --format '{{.Image}}' "bobuy-$service")
            short_id=${image_id#sha256:}
            ref="bobuy-rollback/$service:$rollback_timestamp-${short_id:0:12}"
            [[ "$ref" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/:@-]*$ ]] || { echo 'Invalid rollback image ref' >&2; exit 1; }
            docker tag "$image_id" "$ref"
            docker image inspect "$ref" >/dev/null
            printf "  %s: {image: '%s'}\n" "$service" "$ref" >> .cd/rollback.yml.tmp
          done
          mv .cd/rollback.yml.tmp .cd/rollback.yml
          printf 'services:\n' > .cd/compose.yml.tmp
          for index in "${!services[@]}"; do
            printf "  %s: {image: '%s/%s:%s'}\n" "${services[$index]}" "$REGISTRY" "${images[$index]}" "$REVISION" >> .cd/compose.yml.tmp
          done
          mv .cd/compose.yml.tmp .cd/compose.yml

          # stdin contains only the job token. Never place it in argv or shell tracing.
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d /opt/bobuy/.cd/docker-auth.XXXXXX)
          cleanup_auth() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf -- "$DOCKER_CONFIG"
          }
          trap cleanup_auth EXIT
          pull_images() {
            local result=0
            if docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null; then
              compose pull "${services[@]}" || result=$?
            else
              result=1
            fi
            docker logout ghcr.io >/dev/null 2>&1 || result=1
            return "$result"
          }
          containers_healthy() {
            local attempt service status ready
            for attempt in $(seq 1 30); do
              ready=true
              for service in "${services[@]}"; do
                status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "bobuy-$service") || return 1
                # The manual publisher requires health for the five Java services.
                if [[ "$status" != healthy && !( "$service" == frontend && "$status" == running ) ]]; then ready=false; fi
              done
              if "$ready"; then return 0; fi
              sleep 10
            done
            return 1
          }
          reload_nginx() {
            docker exec bobuy-gateway nginx -t && docker exec bobuy-gateway nginx -s reload
          }
          https_ok() {
            local code
            code=$(curl -fsS --resolve bobuy.cc:443:127.0.0.1 --connect-timeout 5 --max-time 15 \
              --output /dev/null --write-out '%{http_code}' "https://bobuy.cc$1") || return 1
            [[ "$code" == 200 ]]
          }
          healthy() {
            local attempt
            for attempt in $(seq 1 30); do
              if https_ok / && https_ok /health; then return 0; fi
              sleep 10
            done
            return 1
          }
          cleanup_after_deploy() (
            # Subshell and guarded invocation isolate cleanup from deployment/rollback.
            set +e
            removed_tags=0 removed_dirs=0
            trap 'printf "Cleanup removed tags=%s dirs=%s\n" "$removed_tags" "$removed_dirs"; df -h / || echo "WARNING: cleanup disk report failed" >&2' EXIT
            df -h / || echo 'WARNING: cleanup disk report failed' >&2
            keep_ids='|'
            keep_tags='|'
            removed_tag_names='|'
            for service in "${services[@]}"; do
              image_id=$(docker inspect --format '{{.Image}}' "bobuy-$service") || {
                echo 'WARNING: cleanup skipped: running image lookup failed' >&2; return 0;
              }
              [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || {
                echo 'WARNING: cleanup skipped: invalid running image ID' >&2; return 0;
              }
              keep_ids+="$image_id|"
            done
            # rollback.yml is written above in this exact single-quoted inline format.
            rollback_refs=$(sed -n "s/^  [a-z-]*: {image: '\([^']*\)'}$/\1/p" .cd/rollback.yml) || {
              echo 'WARNING: cleanup skipped: rollback refs unreadable' >&2; return 0;
            }
            rollback_count=0
            while IFS= read -r ref; do
              [[ "$ref" =~ ^bobuy-rollback/(core-service|ai-service|im-service|auth-service|gateway-service|frontend):[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || {
                echo 'WARNING: cleanup skipped: invalid rollback ref' >&2; return 0;
              }
              image_id=$(docker image inspect --format '{{.Id}}' "$ref") || {
                echo 'WARNING: cleanup skipped: rollback image lookup failed' >&2; return 0;
              }
              [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]] || {
                echo 'WARNING: cleanup skipped: invalid rollback image ID' >&2; return 0;
              }
              keep_ids+="$image_id|"
              rollback_count=$((rollback_count + 1))
            done <<< "$rollback_refs"
            [[ "$rollback_count" == 6 ]] || {
              echo 'WARNING: cleanup skipped: incomplete rollback set' >&2; return 0;
            }
            inventory=$(docker image ls --no-trunc --format '{{.Repository}} {{.Tag}} {{.ID}}') || {
              echo 'WARNING: cleanup skipped: image listing failed' >&2; return 0;
            }
            while read -r repo tag image_id; do
              [[ "$tag" != '<none>' && -n "$tag" ]] || continue
              if [[ "$keep_ids" == *"|$image_id|"* ]]; then
                keep_tags+="$tag|"
                continue
              fi
              case "$repo" in
                "$REGISTRY"/core|"$REGISTRY"/ai|"$REGISTRY"/im|"$REGISTRY"/auth|"$REGISTRY"/router|"$REGISTRY"/frontend|\
                bobuy/core|bobuy/ai|bobuy/im|bobuy/auth|bobuy/router|bobuy/frontend|\
                bobuy-rollback/core-service|bobuy-rollback/ai-service|bobuy-rollback/im-service|bobuy-rollback/auth-service|bobuy-rollback/gateway-service|bobuy-rollback/frontend)
                  if docker rmi "$repo:$tag"; then
                    removed_tags=$((removed_tags + 1))
                    removed_tag_names+="$tag|"
                  else
                    echo "WARNING: could not remove image tag $repo:$tag" >&2
                  fi
                  ;;
              esac
            done <<< "$inventory"
            if [[ -d /opt/bobuy/releases && ! -L /opt/bobuy/releases ]]; then
              for dir in /opt/bobuy/releases/* /opt/bobuy/releases/.[!.]* /opt/bobuy/releases/..?*; do
                [[ -d "$dir" && ! -L "$dir" ]] || continue
                name=${dir##*/}
                [[ "$name" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || continue
                [[ "$keep_tags" != *"|$name|"* ]] || continue
                # Only delete image-release dirs whose image tag was just retired; dirs without an
                # image (config / reference-data releases, recovery material) are always kept.
                [[ "$removed_tag_names" == *"|$name|"* ]] || continue
                if rm -rf -- "$dir"; then
                  removed_dirs=$((removed_dirs + 1))
                else
                  echo "WARNING: could not remove release directory $dir" >&2
                fi
              done
            fi
            docker image prune -f || echo 'WARNING: dangling image prune failed' >&2
          )
          # Keep every fallible activation step inside the conditional so errexit
          # cannot skip recovery. No dependency services are pulled or recreated.
          if compose config --quiet && pull_images \
            && compose up -d --no-deps --no-build --pull never "${services[@]}" \
            && containers_healthy && reload_nginx && healthy; then
            cleanup_after_deploy || true
            printf '%s %s\n' "$REVISION" "$(date -u +%FT%TZ)" > .cd/deploy-revision
            exit 0
          fi
          echo 'Deployment failed; restoring the six captured image refs.' >&2
          cp .cd/rollback.yml .cd/compose.yml
          if compose up -d --no-deps --no-build --pull never --force-recreate "${services[@]}" \
            && containers_healthy && reload_nginx && healthy; then
            printf 'rollback-from=%s %s images=rollback.yml\n' "$REVISION" "$(date -u +%FT%TZ)" > .cd/last-rollback
            echo 'Captured images restored; this deployment remains failed.' >&2
          else
            echo 'Rollback failed; inspect .cd/rollback.yml and container state.' >&2
          fi
          exit 1
          REMOTE
          )
          # Quote the script as an argument, leaving SSH stdin available for login.
          printf -v remote_command '%q ' env "REVISION=$REVISION" "REGISTRY=$registry" "GHCR_USER=$GHCR_USER" bash -c "$remote_script"
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" "$remote_command"
      - name: Clean up production SSH files
        if: always()
        run: |
          if [[ -n "${PROD_SSH_DIR:-}" ]]; then
            rm -rf -- "$PROD_SSH_DIR"
          fi
      - name: Write deployment summary
        if: always()
        run: |
          {
            echo '## Production deployment'
            echo "- Revision: \`$REVISION\`"
            echo "- Finished (UTC): \`$(date -u +%FT%TZ)\`"
            echo "- Result: \`${{ steps.deploy.outcome }}\`"
            if test '${{ steps.deploy.outcome }}' != success; then
              echo '- Rollback: activation failures restore captured image refs; consult remote logs for recovery or preflight failure'
            else
              echo '- Rollback: not required'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
