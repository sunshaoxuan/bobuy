map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name bobuy.cc www.bobuy.cc;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://bobuy.cc$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bobuy.cc;
    ssl_certificate /etc/letsencrypt/live/bobuy.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bobuy.cc/privkey.pem;
    return 301 https://bobuy.cc$request_uri;
}

server {
    listen 443 ssl;
    server_name bobuy.cc;
    ssl_certificate /etc/letsencrypt/live/bobuy.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bobuy.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-BOBBUY-SERVICE-TOKEN "";
    proxy_set_header X-BOBBUY-INTERNAL-SERVICE "";
    proxy_read_timeout 180s;

    location /ws {
        proxy_pass http://gateway-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-BOBBUY-SERVICE-TOKEN "";
        proxy_set_header X-BOBBUY-INTERNAL-SERVICE "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location /api {
        proxy_pass http://gateway-service:8080;
    }
    # Public signup stays closed until SMTP and abuse/recovery gates are ready.
    location = /api/auth/register {
        default_type application/json;
        return 503 '{"success":false,"message":"Registration is temporarily unavailable. Please try again later."}';
    }
    location = /api/auth/register-account {
        default_type application/json;
        return 503 '{"success":false,"message":"Registration is temporarily unavailable. Please try again later."}';
    }
    location ^~ /api/auth/email/ {
        default_type application/json;
        return 503 '{"success":false,"message":"Email verification is temporarily unavailable."}';
    }
    location = /health {
        proxy_pass http://gateway-service:8080/api/health;
    }
    location /media/ {
        rewrite ^/media/(.*)$ /bobbuy-media/$1 break;
        proxy_pass http://minio:9000;
    }
    location / {
        proxy_pass http://frontend:80;
    }
}
