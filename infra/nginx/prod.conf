server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-BOBBUY-SERVICE-TOKEN "";
    proxy_set_header X-BOBBUY-INTERNAL-SERVICE "";

    location /ws {
        proxy_pass http://gateway-service:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api {
        proxy_pass http://gateway-service:8080;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_maintenance;
    }

    location @api_maintenance {
        default_type application/json;
        add_header Retry-After 20 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 503 '{"success":false,"errorCode":"RELEASE_MAINTENANCE","message":"Release maintenance in progress"}';
    }

    location /health {
        proxy_pass http://gateway-service:8080/api/health;
    }

    location = /_maintenance.html {
        internal;
        root /etc/nginx;
        try_files /maintenance.html =503;
        add_header Retry-After 20 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /_maintenance.html;
    }

    # Legacy object URLs are retired; images are served by the PostgreSQL-backed API.
    location /media/ { return 410; }
}
