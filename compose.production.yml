name: bobuy

secrets:
  bobuy-mail-keyring:
    file: /etc/bobuy-secrets/mail-keyring.properties

x-java: &java
  JAVA_TOOL_OPTIONS: -Xms96m -Xmx320m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2
  BOBBUY_ACCOUNT_MAIL_DELIVERY_ENABLED: 'false'
  BOBBUY_ACCOUNT_PASSWORD_RESET_ENABLED: 'false'
  BOBBUY_ACCOUNT_REQUIRE_VERIFIED_EMAIL_FOR_CHECKOUT: 'false'
  BOBBUY_AUTH_ABUSE_ENABLED: 'false'

# Concurrent JVM startups on the production host can exceed 150 seconds.
x-java-health: &java-health
  start_period: 180s

x-media: &media
  BOBBUY_MEDIA_RUSTFS_ENABLED: ${BOBBUY_MEDIA_RUSTFS_ENABLED:-false}
  BOBBUY_MEDIA_RUSTFS_ENDPOINT: https://bobuy-rustfs:9000
  BOBBUY_MEDIA_RUSTFS_BUCKET: bobuy-media
  BOBBUY_MEDIA_RUSTFS_ACCESS_KEY_FILE: /run/secrets/media-access
  BOBBUY_MEDIA_RUSTFS_SECRET_KEY_FILE: /run/secrets/media-secret
  BOBBUY_MEDIA_RUSTFS_CA_FILE: /run/secrets/media-ca.pem
  BOBBUY_MEDIA_PREFER_OBJECT: ${BOBBUY_MEDIA_PREFER_OBJECT:-false}
  BOBBUY_MEDIA_OBJECT_ONLY_WRITES: ${BOBBUY_MEDIA_OBJECT_ONLY_WRITES:-false}

x-media-files: &media-files
  - type: bind
    source: /etc/bobuy/secrets/rustfs/app-access
    target: /run/secrets/media-access
    read_only: true
    bind: {create_host_path: false}
  - type: bind
    source: /etc/bobuy/secrets/rustfs/app-secret
    target: /run/secrets/media-secret
    read_only: true
    bind: {create_host_path: false}
  - type: bind
    source: /etc/bobuy/secrets/rustfs/ca.pem
    target: /run/secrets/media-ca.pem
    read_only: true
    bind: {create_host_path: false}

services:
  postgres:
    container_name: bobuy-postgres
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'

  redis:
    container_name: bobuy-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
  rabbitmq:
    container_name: bobuy-rabbitmq
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
  nacos:
    container_name: bobuy-nacos
    ports: !reset []
    volumes:
      - ./data/nacos:/home/nacos/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  nacos-init:
    container_name: bobuy-nacos-init
  core-service:
    container_name: bobuy-core-service
    image: bobuy/core:${BOBUY_RELEASE:?Set BO BUY release tag}
    healthcheck: *java-health
    environment:
      <<: [*java, *media]
      BOBBUY_AI_COSTCO_WORKER_ENABLED: ${BOBBUY_AI_COSTCO_WORKER_ENABLED:-true}
      BOBBUY_PHOTO_QUICK_PUBLISH_WORKER_ENABLED: ${BOBBUY_PHOTO_QUICK_PUBLISH_WORKER_ENABLED:-true}
      BOBBUY_OFFICIAL_IMAGE_LOOKUP_WORKER_ENABLED: ${BOBBUY_OFFICIAL_IMAGE_LOOKUP_WORKER_ENABLED:-true}
      BOBBUY_AI_LLM_CODEX_BRIDGE_URL: ${BOBBUY_AI_LLM_CODEX_BRIDGE_URL:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_MODEL: ${BOBBUY_AI_LLM_CODEX_BRIDGE_MODEL:-gpt-6.1-terra}
      BOBBUY_AI_LLM_CODEX_BRIDGE_API_KEY: ${BOBBUY_AI_LLM_CODEX_BRIDGE_API_KEY:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_TIMEOUT_SECONDS: ${BOBBUY_AI_LLM_CODEX_BRIDGE_TIMEOUT_SECONDS:-120}
      BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_SALT: ${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_SALT:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_NONCE: ${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_NONCE:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_CIPHERTEXT: ${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_CIPHERTEXT:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_TAG: ${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_TAG:-}
      BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_ITERATIONS: ${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_ITERATIONS:-200000}
      BOBBUY_AI_SECRET_MASTER_PASSWORD: ${BOBBUY_AI_SECRET_MASTER_PASSWORD:-}
      BOBBUY_MEDIA_WORKER_ENABLED: ${BOBBUY_MEDIA_WORKER_ENABLED:-false}
      BOBBUY_ACCOUNT_REGISTRATION_ENABLED: ${BOBBUY_ACCOUNT_REGISTRATION_ENABLED:-false}
      BOBBUY_ACCOUNT_REGISTRATION_TEST_ENABLED: ${BOBBUY_ACCOUNT_REGISTRATION_TEST_ENABLED:-false}
      BOBBUY_ACCOUNT_PUBLIC_BASE_URL: ${BOBBUY_ACCOUNT_PUBLIC_BASE_URL:-https://bobuy.cc}
      BOBBUY_ACCOUNT_MAIL_DELIVERY_ENABLED: ${BOBBUY_ACCOUNT_MAIL_DELIVERY_ENABLED:-false}
      BOBBUY_ACCOUNT_REQUIRE_VERIFIED_EMAIL_FOR_CHECKOUT: ${BOBBUY_ACCOUNT_REQUIRE_VERIFIED_EMAIL_FOR_CHECKOUT:-false}
      BOBBUY_AUTH_ABUSE_ENABLED: ${BOBBUY_AUTH_ABUSE_ENABLED:-false}
      BOBBUY_AUTH_ABUSE_TRUSTED_PROXIES: ${BOBBUY_AUTH_ABUSE_TRUSTED_PROXIES:-}
      BOBBUY_REGISTRATION_CLEANUP_ACCOUNTS: ${BOBBUY_REGISTRATION_CLEANUP_ACCOUNTS:-}
      BOBUY_MAIL_SMTP_READ_TIMEOUT_MS: ${BOBUY_MAIL_SMTP_READ_TIMEOUT_MS:-15000}
      BOBUY_MAIL_KEYRING_FILE: /run/bobuy-mail/keyring.properties
      BOBUY_MAIL_ACTIVE_KEY_ID: mail_20261112
      BOBUY_MAIL_TEST_RECIPIENTS: postmaster@bobuy.cc
    volumes: *media-files
    secrets:
      - source: bobuy-mail-keyring
        target: /run/bobuy-mail/keyring.properties
    deploy:
      resources:
        limits:
          memory: 704M
          cpus: '1.0'
  ai-service:
    container_name: bobuy-ai-service
    image: bobuy/ai:${BOBUY_RELEASE:?Set BO BUY release tag}
    healthcheck: *java-health
    environment:
      <<: [*java, *media]
      BOBBUY_MEDIA_WORKER_ENABLED: 'false'
    volumes: *media-files
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  im-service:
    container_name: bobuy-im-service
    image: bobuy/im:${BOBUY_RELEASE:?Set BO BUY release tag}
    healthcheck: *java-health
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  auth-service:
    container_name: bobuy-auth-service
    image: bobuy/auth:${BOBUY_RELEASE:?Set BO BUY release tag}
    healthcheck: *java-health
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  gateway-service:
    container_name: bobuy-gateway-service
    image: bobuy/router:${BOBUY_RELEASE:?Set BO BUY release tag}
    healthcheck: *java-health
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
  frontend:
    container_name: bobuy-frontend
    image: bobuy/frontend:${BOBUY_RELEASE:?Set BO BUY release tag}
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.5'
  gateway:
    container_name: bobuy-gateway
    ports: !override
      - '80:80'
      - '443:443'
    volumes: !override
      - ./infra/nginx/bobuy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/maintenance.html:/etc/nginx/maintenance.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./data/acme:/var/www/acme:ro
      - ./data/logs/gateway:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
  ocr-service:
    container_name: bobuy-ocr-service
    profiles: [ocr]
    ports: !reset []

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:e287e99762a4a3e7b706526e01f2ff755f67db165e9be9f6b907adc6fb6d6ee1
    container_name: bobuy-rustfs
    profiles: [object-storage]
    user: '10001:10001'
    restart: unless-stopped
    command: [/data]
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/root-access
      RUSTFS_SECRET_KEY_FILE: /run/secrets/root-secret
      RUSTFS_TLS_PATH: /run/bobuy-rustfs/tls
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - ./data/rustfs:/data
      - {type: bind, source: /etc/bobuy/secrets/rustfs/root-access, target: /run/secrets/root-access, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/root-secret, target: /run/secrets/root-secret, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/ca.pem, target: /run/bobuy-rustfs/ca.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/server-cert.pem, target: /run/bobuy-rustfs/tls/rustfs_cert.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/server-key.pem, target: /run/bobuy-rustfs/tls/rustfs_key.pem, read_only: true, bind: {create_host_path: false}}
    networks:
      bobbuy-net:
        aliases: [bobuy-rustfs]
    deploy:
      resources:
        limits: {memory: 1G, cpus: '1.0'}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

networks:
  bobbuy-net:
    name: bobuy-net
