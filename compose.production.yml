name: bobuy

x-java: &java
  JAVA_TOOL_OPTIONS: -Xms96m -Xmx320m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2

x-media: &media
  BOBBUY_MEDIA_RUSTFS_ENABLED: ${BOBBUY_MEDIA_RUSTFS_ENABLED:-false}
  BOBBUY_MEDIA_RUSTFS_ENDPOINT: https://bobuy-rustfs:9000
  BOBBUY_MEDIA_RUSTFS_BUCKET: bobuy-media
  BOBBUY_MEDIA_RUSTFS_ACCESS_KEY_FILE: /run/secrets/media-access
  BOBBUY_MEDIA_RUSTFS_SECRET_KEY_FILE: /run/secrets/media-secret
  BOBBUY_MEDIA_RUSTFS_CA_FILE: /run/secrets/media-ca.pem
  BOBBUY_MEDIA_PREFER_OBJECT: ${BOBBUY_MEDIA_PREFER_OBJECT:-false}
  BOBBUY_MEDIA_OBJECT_ONLY_WRITES: ${BOBBUY_MEDIA_OBJECT_ONLY_WRITES:-false}

x-media-files: &media-files
  - type: bind
    source: /etc/bobuy/secrets/rustfs/app-access
    target: /run/secrets/media-access
    read_only: true
    bind: {create_host_path: false}
  - type: bind
    source: /etc/bobuy/secrets/rustfs/app-secret
    target: /run/secrets/media-secret
    read_only: true
    bind: {create_host_path: false}
  - type: bind
    source: /etc/bobuy/secrets/rustfs/ca.pem
    target: /run/secrets/media-ca.pem
    read_only: true
    bind: {create_host_path: false}

services:
  postgres:
    container_name: bobuy-postgres
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '1.0'

  redis:
    container_name: bobuy-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
  rabbitmq:
    container_name: bobuy-rabbitmq
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
  nacos:
    container_name: bobuy-nacos
    ports: !reset []
    volumes:
      - ./data/nacos:/home/nacos/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  nacos-init:
    container_name: bobuy-nacos-init
  core-service:
    container_name: bobuy-core-service
    image: bobuy/core:${BOBUY_RELEASE:?Set BO BUY release tag}
    environment:
      <<: [*java, *media]
      BOBBUY_MEDIA_WORKER_ENABLED: ${BOBBUY_MEDIA_WORKER_ENABLED:-false}
    volumes: *media-files
    deploy:
      resources:
        limits:
          memory: 704M
          cpus: '1.0'
  ai-service:
    container_name: bobuy-ai-service
    image: bobuy/ai:${BOBUY_RELEASE:?Set BO BUY release tag}
    environment:
      <<: [*java, *media]
      BOBBUY_MEDIA_WORKER_ENABLED: 'false'
    volumes: *media-files
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  im-service:
    container_name: bobuy-im-service
    image: bobuy/im:${BOBUY_RELEASE:?Set BO BUY release tag}
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  auth-service:
    container_name: bobuy-auth-service
    image: bobuy/auth:${BOBUY_RELEASE:?Set BO BUY release tag}
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
  gateway-service:
    container_name: bobuy-gateway-service
    image: bobuy/router:${BOBUY_RELEASE:?Set BO BUY release tag}
    environment:
      <<: *java
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
  frontend:
    container_name: bobuy-frontend
    image: bobuy/frontend:${BOBUY_RELEASE:?Set BO BUY release tag}
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.5'
  gateway:
    container_name: bobuy-gateway
    ports: !override
      - '80:80'
      - '443:443'
    volumes: !override
      - ./infra/nginx/bobuy.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./data/acme:/var/www/acme:ro
      - ./data/logs/gateway:/var/log/nginx
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.5'
  ocr-service:
    container_name: bobuy-ocr-service
    profiles: [ocr]
    ports: !reset []

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:e287e99762a4a3e7b706526e01f2ff755f67db165e9be9f6b907adc6fb6d6ee1
    container_name: bobuy-rustfs
    profiles: [object-storage]
    user: '10001:10001'
    restart: unless-stopped
    command: [/data]
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/root-access
      RUSTFS_SECRET_KEY_FILE: /run/secrets/root-secret
      RUSTFS_TLS_PATH: /run/bobuy-rustfs/tls
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - ./data/rustfs:/data
      - {type: bind, source: /etc/bobuy/secrets/rustfs/root-access, target: /run/secrets/root-access, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/root-secret, target: /run/secrets/root-secret, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/ca.pem, target: /run/bobuy-rustfs/ca.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/server-cert.pem, target: /run/bobuy-rustfs/tls/rustfs_cert.pem, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: /etc/bobuy/secrets/rustfs/server-key.pem, target: /run/bobuy-rustfs/tls/rustfs_key.pem, read_only: true, bind: {create_host_path: false}}
    networks:
      bobbuy-net:
        aliases: [bobuy-rustfs]
    deploy:
      resources:
        limits: {memory: 1G, cpus: '1.0'}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

networks:
  bobbuy-net:
    name: bobuy-net
