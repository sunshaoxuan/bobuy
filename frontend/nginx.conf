server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = / { default_type text/html; try_files /home.html =404; }
    location = /robots.txt { default_type text/plain; try_files /robots.txt =404; }
    location = /sitemap.xml { types { application/xml xml; } try_files /sitemap.xml =404; }
    location ~ ^/(admin|login|account|cart|checkout|client)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
