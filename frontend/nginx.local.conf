server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    location = / { default_type text/html; try_files /home.html =404; }
    location = /robots.txt { default_type text/plain; try_files /robots.txt =404; }
    location = /sitemap.xml { types { application/xml xml; } try_files /sitemap.xml =404; }
    location ~ ^/(admin|login|account|cart|checkout|client)(/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
    location /ws { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
    location / { try_files $uri $uri/ /index.html; }
}
