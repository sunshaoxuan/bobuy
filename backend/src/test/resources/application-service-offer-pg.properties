# Explicit opt-in synthetic PG tests only; the test class pins URL/schema before connection.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.flyway.enabled=false
spring.sql.init.mode=never
bobbuy.seed.enabled=false
bobbuy.seed.force-reset-on-invoke=false
# Override the generic test profile's dev CUSTOMER fallback: exercise real anonymous security.
bobbuy.security.header-auth.enabled=false
spring.config.import=
