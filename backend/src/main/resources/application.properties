# ====================================================================
# BOBBuy Base Configuration
# ====================================================================

# spring.application.name=bobbuy
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.mail.host=${BOBUY_MAIL_HOST:localhost}
spring.mail.port=${BOBUY_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
bobuy.mail.from=${BOBUY_MAIL_FROM:accounts@bobuy.cc}

# Infrastructure Defaults (Environment variables take precedence)

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_DEFAULT_USER:bobbuy}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_DEFAULT_PASS:bobbuypassword}}

bobbuy.websocket.broker-relay.enabled=false
bobbuy.websocket.broker-relay.host=${spring.rabbitmq.host}
bobbuy.websocket.broker-relay.port=${BOBBUY_WEBSOCKET_BROKER_RELAY_PORT:61613}
bobbuy.websocket.broker-relay.login=${spring.rabbitmq.username}
bobbuy.websocket.broker-relay.passcode=${spring.rabbitmq.password}
bobbuy.websocket.heartbeat.send-interval-ms=${BOBBUY_WEBSOCKET_HEARTBEAT_SEND_INTERVAL_MS:5000}
bobbuy.websocket.heartbeat.receive-interval-ms=${BOBBUY_WEBSOCKET_HEARTBEAT_RECEIVE_INTERVAL_MS:5000}
bobbuy.chat.redis.pubsub.enabled=${BOBBUY_CHAT_REDIS_PUBSUB_ENABLED:false}
bobbuy.chat.redis.pubsub.channel=${BOBBUY_CHAT_REDIS_PUBSUB_CHANNEL:bobbuy.chat.realtime}

# Seed Data
bobbuy.seed.enabled=${BOBBUY_SEED_ENABLED:false}

# Database migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${BOBBUY_FLYWAY_BASELINE_ON_MIGRATE:false}

bobbuy.security.jwt.secret=${BOBBUY_SECURITY_JWT_SECRET:}
bobbuy.security.jwt.ttl-seconds=${BOBBUY_SECURITY_JWT_TTL_SECONDS:3600}
bobbuy.security.refresh-token.ttl-seconds=${BOBBUY_SECURITY_REFRESH_TOKEN_TTL_SECONDS:604800}
bobbuy.security.refresh-token.rotation-enabled=${BOBBUY_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED:true}
bobbuy.security.refresh-cookie.name=${BOBBUY_SECURITY_REFRESH_COOKIE_NAME:bobbuy_refresh_token}
bobbuy.security.refresh-cookie.path=${BOBBUY_SECURITY_REFRESH_COOKIE_PATH:/api/auth}
bobbuy.security.refresh-cookie.secure=${BOBBUY_SECURITY_REFRESH_COOKIE_SECURE:false}
bobbuy.security.refresh-cookie.same-site=${BOBBUY_SECURITY_REFRESH_COOKIE_SAME_SITE:Lax}
bobbuy.security.csrf.cookie-name=${BOBBUY_SECURITY_CSRF_COOKIE_NAME:bobbuy_csrf_token}
bobbuy.security.csrf.cookie-path=${BOBBUY_SECURITY_CSRF_COOKIE_PATH:/}
bobbuy.security.csrf.header-name=${BOBBUY_SECURITY_CSRF_HEADER_NAME:X-BOBBUY-CSRF-TOKEN}
bobbuy.security.cors.allowed-origin-patterns=${BOBBUY_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost,http://127.0.0.1,http://localhost:4173,http://127.0.0.1:4173,http://localhost:5173,http://127.0.0.1:5173}
bobbuy.security.header-auth.enabled=${BOBBUY_SECURITY_HEADER_AUTH_ENABLED:false}
bobbuy.security.service-token.secret=${BOBBUY_SECURITY_SERVICE_TOKEN:}

# AI Hermes
bobbuy.ai.llm.main.provider=${BOBBUY_AI_LLM_MAIN_PROVIDER:auto}
bobbuy.ai.llm.main.url=${BOBBUY_AI_LLM_MAIN_URL:}
bobbuy.ai.llm.main.model=${BOBBUY_AI_LLM_MAIN_MODEL:qwen2.5:7b}
bobbuy.ai.llm.codex.command=${BOBBUY_AI_LLM_CODEX_COMMAND:}
bobbuy.ai.llm.codex.timeout-seconds=${BOBBUY_AI_LLM_CODEX_TIMEOUT_SECONDS:120}
bobbuy.ai.llm.codex-bridge.url=${BOBBUY_AI_LLM_CODEX_BRIDGE_URL:}
bobbuy.ai.llm.codex-bridge.model=${BOBBUY_AI_LLM_CODEX_BRIDGE_MODEL:gpt-5.3-codex}
bobbuy.ai.llm.codex-bridge.api-key=${BOBBUY_AI_LLM_CODEX_BRIDGE_API_KEY:}
bobbuy.ai.llm.codex-bridge.timeout-seconds=${BOBBUY_AI_LLM_CODEX_BRIDGE_TIMEOUT_SECONDS:120}
bobbuy.ai.llm.codex-bridge.secret.salt=${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_SALT:}
bobbuy.ai.llm.codex-bridge.secret.nonce=${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_NONCE:}
bobbuy.ai.llm.codex-bridge.secret.ciphertext=${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_CIPHERTEXT:}
bobbuy.ai.llm.codex-bridge.secret.tag=${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_TAG:}
bobbuy.ai.llm.codex-bridge.secret.iterations=${BOBBUY_AI_LLM_CODEX_BRIDGE_SECRET_ITERATIONS:200000}
bobbuy.ai.secret.master-password=${BOBBUY_AI_SECRET_MASTER_PASSWORD:}
bobbuy.ai.llm.ollama.health-timeout-seconds=${BOBBUY_AI_LLM_OLLAMA_HEALTH_TIMEOUT_SECONDS:3}
bobbuy.ai.llm.edge.url=${BOBBUY_AI_LLM_EDGE_URL:}
bobbuy.ai.llm.edge.model=${BOBBUY_AI_LLM_EDGE_MODEL:llama3.2-vision:11b}
bobbuy.ocr.url=${BOBBUY_OCR_URL:http://localhost:8000}
